<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="stylesheet" href="css/styles.css">

</head>
<body>

<div class="container">

    <h4>PokéAPI</h4>
    <h1>Pokédex</h1>
    <p class="subtitulo">
        Pesquise um Pokémon pelo nome ou ID.
    </p>

    <input
        type="text"
        id="campoTexto"
        placeholder="Ex: Pikachu ou 25"
    >

    <button id="btnConsultar">Pesquisar</button>
    <button id="btnLimpar">Limpar</button>
    <div id="display"></div>
    <p class="nomesPokemon">
        Exemplos para testar: pikachu, charizard, bulbasaur,
        squirtle, mewtwo, eevee, snorlax, gengar, lucario,
        psyduck, jigglypuff, dragonite, gyarados, lapras
    </p>
</div>
<script src="js/script.js"></script>

</body>

</html>
